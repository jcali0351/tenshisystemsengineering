# Tenshi Scraper: refreshes the News page with ten new stories per category from public news feeds.
# Started by the "Run Tenshi Scraper" button in the Tenshi Editor (admin.html), which saves data/scrape-request.json,
# or by hand from the Actions tab (Run workflow). The stock ticker has its own job (stock-ticker.yml).
name: Tenshi Scraper
run-name: Tenshi Scraper (${{ github.event_name == 'push' && 'from the Tenshi Editor' || 'run by hand' }})

on:
  push:
    branches: [main]
    paths: ["data/scrape-request.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-rebuild
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest version, even if this run waited behind another job
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the build tools (Tailwind CLI)
        run: npm ci --ignore-scripts
      - name: Gather news stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/news-scraper.mjs
      - name: Find feature images (free photos with credit, or a generated cover)
        run: node tools/add-images.mjs news
      - name: Rebuild pages
        run: npm run build
      - name: Commit
        run: |
          git config user.name "tenshi-scraper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/news.json data/image-cache.json img/stories '*.html' tailwind.css
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Tenshi Scraper: refresh news stories"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash -X theirs origin main; sleep 5
          done
          exit 1
