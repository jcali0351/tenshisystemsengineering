# Stock ticker: refreshes data/ticker.json (delayed prices for the scrolling ticker at the top of every page)
# every 30 minutes while the Tokyo Stock Exchange is open (9:00-15:30 JST = 00:00-06:30 UTC, Monday to Friday),
# plus once after the close. GitHub may run scheduled jobs a few minutes late.
name: Stock ticker
run-name: Stock ticker refresh

on:
  schedule:
    - cron: "5,35 0-6 * * 1-5"
    - cron: "50 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-ticker
  cancel-in-progress: true

jobs:
  ticker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch prices
        run: node tools/ticker.mjs
      - name: Commit
        run: |
          git config user.name "tenshi-ticker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ticker.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Stock ticker: refresh prices"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main; sleep 5
          done
          exit 1
