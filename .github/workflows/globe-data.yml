# World Pulse data: feeds the 3D globe at viz/world-pulse.html (Media > Visualization).
# - Markets (data/globe/markets.json): delayed world indexes, commodities and currencies, every 30 minutes on weekdays.
# - Satellites (data/globe/sats.json): orbits of every active satellite from CelesTrak, every 6 hours.
# - Weather (data/globe/weather.json): wind, jet stream and temperature from NOAA's GFS model, at most every 2.5 hours.
# - The sea (data/globe/ocean.json): wave model, ocean currents and tide predictions at most every 5.5 hours, wave
#   buoys on every run (hourly at weekends, when the markets schedule rests).
# - Infrastructure (data/globe/world.json): land, coast, ports, railways, airports, routes, data centres and cables
#   from open data, once a week, and whenever the tools below change.
name: World Pulse data
run-name: World Pulse data refresh

on:
  schedule:
    - cron: "12,42 * * * 1-5"
    - cron: "27 5 * * 0"
    - cron: "50 */6 * * *"
    - cron: "33 * * * 0,6"
  push:
    branches: [tenshi-cms]
    paths: ["tools/globe-data.mjs", "tools/globe-markets.mjs", "tools/globe-sats.mjs", "tools/globe-stocks.mjs", "tools/globe-weather.mjs", "tools/globe-ocean.mjs", "tools/globe-moon.py", ".github/workflows/globe-data.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: globe-data
  cancel-in-progress: false

jobs:
  globe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tenshi-cms
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch market prices
        run: node tools/globe-markets.mjs
        continue-on-error: true
      - name: Fetch the day's move for the biggest companies on each exchange
        run: node tools/globe-stocks.mjs
        continue-on-error: true
      - name: Fetch satellite orbits (at most every 6 hours)
        run: node tools/globe-sats.mjs
        continue-on-error: true
      - name: Fetch wind, jet stream and temperature (at most every 2.5 hours)
        run: node tools/globe-weather.mjs
        continue-on-error: true
      - name: Fetch waves, ocean currents, tides and wave buoys
        run: node tools/globe-ocean.mjs
        continue-on-error: true
      - name: Fetch the Moon's map once, while data/globe/moon.json is missing
        if: hashFiles('data/globe/moon.json') == ''
        run: python3 tools/globe-moon.py
        continue-on-error: true
      - name: Fetch infrastructure (weekly, on a tool change, or when the file is missing)
        if: github.event_name != 'schedule' || github.event.schedule == '27 5 * * 0' || hashFiles('data/globe/world.json') == ''
        run: node tools/globe-data.mjs
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "tenshi-globe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/globe
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "World Pulse: refresh data"
          for i in 1 2 3 4; do
            git push origin HEAD:tenshi-cms && exit 0
            git pull --rebase --autostash origin tenshi-cms; sleep 5
          done
          exit 1
