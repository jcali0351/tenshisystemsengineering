name: CMS tests
# Runs the client CMS's test suite (platform/tests) whenever its code changes, on any branch.
on:
  push:
    paths: ["platform/**", ".github/workflows/cms-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - name: Install
        run: python -m pip install -r platform/requirements.txt
      - name: Run the tests
        working-directory: platform
        run: python -m pytest tests -q --no-header -p no:cacheprovider 2>&1 | tail -80
        shell: bash -o pipefail {0}
