# Tenshi Blog Writer: writes new blog posts from recent tech and business news, each crediting the reports it uses.
# Started by the "Run Tenshi Blog Writer" button in the Tenshi Editor (admin.html), which saves data/blog-request.json,
# or by hand from the Actions tab (Run workflow). Needs the ANTHROPIC_API_KEY repository secret.
name: Tenshi Blog Writer
run-name: Tenshi Blog Writer (${{ github.event_name == 'push' && 'from the Tenshi Editor' || 'run by hand' }})

on:
  push:
    branches: [main]
    paths: ["data/blog-request.json"]
  workflow_dispatch:
    inputs:
      posts:
        description: "How many posts to write (1-5)"
        default: "3"

permissions:
  contents: write

concurrency:
  group: cms-rebuild
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the build tools (Tailwind CLI)
        run: npm ci --ignore-scripts
      - name: Write blog posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTS: ${{ github.event.inputs.posts }}
        run: node tools/blog-writer.mjs
      - name: Find feature images (free photos with credit, or a generated cover)
        run: node tools/add-images.mjs
      - name: Rebuild pages
        run: npm run build
      - name: Commit
        run: |
          git config user.name "tenshi-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/blog.json data/image-cache.json img/stories '*.html' tailwind.css
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Tenshi Blog Writer: new posts"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main; sleep 5
          done
          exit 1
