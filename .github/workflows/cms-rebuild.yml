# After a save from the Tenshi Editor (admin.html), rebuild the generated pages and restamp assets,
# so the pages' built-in text, menus and picture links match translations.js and the pictures.
# Editor commits start with "CMS:". The bot's own commit only touches the generated pages, so it never loops.
name: Rebuild after site edit
run-name: Rebuild pages (${{ github.event.head_commit.message }})

on:
  push:
    branches: [main]
    paths: ["translations.js", "img/**", "brand/**", "tools/build-pages.mjs", "styles.css", "design.css", "app.js", "design.js", "chat.js", "chat.css", "rain.js"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild pages and restamp assets
        run: |
          node tools/build-pages.mjs
          node tools/stamp-assets.mjs
      - name: Commit
        run: |
          git config user.name "tenshi-editor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Rebuild pages and asset stamps after a site edit"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main; sleep 5
          done
          exit 1
