# After a save from the Tenshi Editor (admin.html), rebuild the generated pages, Tailwind CSS and asset stamps,
# so the pages' built-in text, menus and picture links match translations.js and the pictures.
# Editor commits start with "CMS:". The bot's own commit only touches the generated pages, so it never loops.
name: Rebuild after site edit
run-name: Rebuild pages (${{ github.event.head_commit.message }})

on:
  push:
    branches: [main]
    paths: ["data/slogan.json", "data/parallax.json", "data/buttons.json", "buttons.css", "custom.css", "admin/**", "fonts/fonts.json", "*.html", "services/*.html", "projects/*.html", "translations.js", "img/**", "brand/**", "tools/build-pages.mjs", "src/tailwind.css", "package.json", "package-lock.json", "styles.css", "design.css", "site-theme.css", "app.js", "design.js", "chat.js", "chat.css", "rain.js", "search.css", "search.js"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the build tools (Tailwind CLI)
        run: npm ci --ignore-scripts
      - name: Rebuild pages, Tailwind CSS and asset stamps
        run: npm run build
      - name: Commit
        run: |
          git config user.name "tenshi-editor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' tailwind.css slogan.css buttons.css custom.css data/search
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Rebuild pages and asset stamps after a site edit"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main; sleep 5
          done
          exit 1
