<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tenshi Logo Preview</title>
  <style>
    body { margin: 0; font: 15px/1.5 Lato, "Segoe UI", Arial, sans-serif; background: #0b0306; color: #f3e6e8; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 28px; }
    h1 { font-size: 1.4rem; margin: 0; }
    section { border-radius: 16px; padding: 32px; display: grid; place-items: center; gap: 14px; }
    .dark { background: radial-gradient(ellipse at 30% 20%, #3a0912, #0b0306 70%); border: 1px solid #3a1118; }
    .light { background: #fff; color: #16191e; border: 1px solid #e3e6ea; }
    .red { background: linear-gradient(135deg, #c8102e, #6b0616); }
    .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; justify-content: center; }
    img { max-width: 100%; height: auto; }
    p { margin: 0; opacity: .75; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Tenshi Systems Engineering · high-tech logo</h1>
    <section class="dark"><img src="tenshi-mark.svg" width="320" height="320" alt="Mark"><p>tenshi-mark.svg</p></section>
    <section class="dark"><img src="tenshi-logo-dark.svg" width="820" height="240" alt="Horizontal logo, dark background"><p>tenshi-logo-dark.svg</p></section>
    <section class="light"><img src="tenshi-logo-light.svg" width="820" height="240" alt="Horizontal logo, light background"><p>tenshi-logo-light.svg</p></section>
    <section class="red"><div class="row"><img src="tenshi-mark.svg" width="128" height="128" alt=""><img src="tenshi-mark.svg" width="64" height="64" alt=""><img src="tenshi-mark.svg" width="32" height="32" alt=""><img src="tenshi-mark.svg" width="16" height="16" alt=""></div><p>Small sizes (app icon to browser tab)</p></section>
  </main>
</body>
</html>
