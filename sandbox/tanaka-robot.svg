<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Tanaka as a friendly purple robot (neon preview only). The eyes blink and the antenna glows on its own. -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#2e0b57"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3d4ff"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0b4d"/>
      <stop offset="1" stop-color="#14052b"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff3e0"/>
      <stop offset=".35" stop-color="#ff8a2b"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background disc -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#c4a1ff" stroke-opacity=".35" stroke-width="2"/>

  <!-- antenna with a glowing tip -->
  <rect x="97" y="34" width="6" height="22" rx="3" fill="#e3d4ff"/>
  <circle cx="100" cy="32" r="8" fill="url(#eye)" filter="url(#glow)">
    <animate attributeName="r" values="7;9;7" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.6;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ears -->
  <rect x="34" y="88" width="14" height="34" rx="6" fill="#c4a1ff"/>
  <rect x="152" y="88" width="14" height="34" rx="6" fill="#c4a1ff"/>

  <!-- head -->
  <rect x="44" y="54" width="112" height="100" rx="30" fill="url(#head)"/>

  <!-- visor -->
  <rect x="56" y="76" width="88" height="44" rx="20" fill="url(#visor)"/>
  <rect x="62" y="80" width="40" height="6" rx="3" fill="#ffffff" opacity=".12"/>

  <!-- eyes (blink every few seconds) -->
  <g filter="url(#glow)">
    <ellipse cx="80" cy="98" rx="9" ry="9" fill="url(#eye)">
      <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;.9;.94;.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="98" rx="9" ry="9" fill="url(#eye)">
      <animate attributeName="ry" values="9;9;1;9;9" keyTimes="0;.9;.94;.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- smile made of little lights -->
  <g fill="#a855f7">
    <circle cx="84" cy="134" r="3"/>
    <circle cx="92" cy="138" r="3"/>
    <circle cx="100" cy="139.5" r="3"/>
    <circle cx="108" cy="138" r="3"/>
    <circle cx="116" cy="134" r="3"/>
  </g>
  <!-- cheek lights -->
  <circle cx="62" cy="132" r="5" fill="#ff6ec7" opacity=".55"/>
  <circle cx="138" cy="132" r="5" fill="#ff6ec7" opacity=".55"/>
</svg>
