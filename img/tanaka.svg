<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Illustrated portrait of Tanaka Matsumoto, the AI assistant">
  <!-- An original illustration: Tanaka Matsumoto, Tenshi's AI assistant. A character, not a photo of a real person. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0263f"/><stop offset="1" stop-color="#8e0b20"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3140"/><stop offset="1" stop-color="#171b24"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d2b3"/><stop offset="1" stop-color="#e6b994"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a30"/><stop offset="1" stop-color="#0f0f13"/></linearGradient>
    <clipPath id="round"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="160" cy="34" r="46" fill="#fff" fill-opacity=".08"/>
    <circle cx="30" cy="170" r="60" fill="#fff" fill-opacity=".05"/>
    <!-- shoulders and suit -->
    <path d="M22 210c4-38 30-58 78-62 48 4 74 24 78 62z" fill="url(#suit)"/>
    <path d="M100 150 82 152l18 48 18-48z" fill="#f5f7fa"/>
    <path d="M100 156 93 162l4 6-5 32h16l-5-32 4-6z" fill="#c8102e"/>
    <path d="M100 156l-7 6 4 6h6l4-6z" fill="#a10c23"/>
    <path d="M82 152l-10 6 22 42zM118 152l10 6-22 42z" fill="#232836"/>
    <path d="M72 158c-6 10-8 26-8 42M128 158c6 10 8 26 8 42" stroke="#3a4153" stroke-width="2" fill="none"/>
    <!-- neck -->
    <path d="M88 128h24v24c-6 5-18 5-24 0z" fill="#e2b38d"/>
    <!-- ears -->
    <ellipse cx="66" cy="96" rx="7" ry="11" fill="#e8bd98"/>
    <ellipse cx="134" cy="96" rx="7" ry="11" fill="#e8bd98"/>
    <!-- face -->
    <path d="M68 86c0-24 14-40 32-40s32 16 32 40c0 26-14 46-32 46s-32-20-32-46z" fill="url(#skin)"/>
    <!-- hair: short, neat, parted -->
    <path d="M66 92c-4-30 12-52 36-52 22 0 36 16 34 46-3-10-8-20-15-24-12 6-30 8-46 4-5 6-8 16-9 26z" fill="url(#hair)"/>
    <path d="M92 44c-8 6-12 14-13 22 10-8 22-12 34-12-6-4-14-8-21-10z" fill="#3a3a42" fill-opacity=".7"/>
    <!-- brows, eyes, nose, smile -->
    <path d="M78 84c5-3 11-3 16-1M106 83c5-2 11-2 16 1" stroke="#1d1d22" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="86" cy="95" rx="6.5" ry="4.6" fill="#fff"/>
    <ellipse cx="114" cy="95" rx="6.5" ry="4.6" fill="#fff"/>
    <circle cx="86.5" cy="95.3" r="3.6" fill="#3b2a22"/>
    <circle cx="114.5" cy="95.3" r="3.6" fill="#3b2a22"/>
    <circle cx="86.5" cy="95.3" r="1.7" fill="#111"/>
    <circle cx="114.5" cy="95.3" r="1.7" fill="#111"/>
    <circle cx="87.8" cy="94" r="1" fill="#fff"/>
    <circle cx="115.8" cy="94" r="1" fill="#fff"/>
    <path d="M79.5 92.6c4-3.4 9.5-3.6 13-.6M107.5 92c3.5-3 9-2.8 13 .6" stroke="#1d1d22" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M100 96v14c0 2-2 3-5 3" stroke="#c99a76" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M89 119c6 5 16 5 22 0" stroke="#a5644a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="80" cy="108" rx="6" ry="3.5" fill="#e79a8b" fill-opacity=".35"/>
    <ellipse cx="120" cy="108" rx="6" ry="3.5" fill="#e79a8b" fill-opacity=".35"/>
    <!-- a small spark: he is an AI -->
    <path d="M163 54l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff"/>
    <!-- company pin on the lapel -->
    <rect x="124" y="166" width="9" height="9" rx="2" fill="#fff"/><rect x="126" y="168" width="5" height="5" fill="#c8102e"/>
  </g>
</svg>
