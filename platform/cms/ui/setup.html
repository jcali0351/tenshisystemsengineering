<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Welcome · Tenshi CMS</title><script>/* display mode + accent before the first paint (static/theme-switch.js wires the buttons) */(function(d,k,K,A,D){var t,a;try{t=localStorage.getItem(k);a=localStorage.getItem(K)}catch(e){}if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";d.setAttribute("data-theme",t);d.setAttribute("data-accent",A.indexOf(a)>=0?a:D);d.setAttribute("data-theme-key",k);d.setAttribute("data-accent-key",K)})(document.documentElement,"tenshi-cms-theme","tenshi-cms-accent",["orange","lime"],"orange")</script><link rel="stylesheet" href="/static/cms.css"></head>
<body>
<main class="auth">
  <form class="card" method="post" action="/setup">
    <div class="logo"><span class="logo-mark">天</span> Tenshi CMS</div>
    <div class="theme-ctl" role="group" aria-label="Display">
    <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" title="Switch to light mode"><span class="sr-only">Switch to light mode</span>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <span class="accent-pick" role="group" aria-label="Accent colour">
      <button type="button" data-set-accent="orange" aria-pressed="true" aria-label="Orange accent" title="Orange" style="--sw:#ff8c1a"></button>
      <button type="button" data-set-accent="lime" aria-pressed="false" aria-label="Lime green accent" title="Lime green" style="--sw:#a3e635"></button>
    </span>
      </div>
    <h1>Welcome</h1>
    <p class="muted">Create the first admin account. You can add more people later under Users.</p>
    {% if error %}<p class="error-box" role="alert">{{ error }}</p>{% endif %}
    <label class="field"><span>Your name</span><input type="text" name="name" autocomplete="name" required autofocus></label>
    <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></label>
    <button class="btn btn-primary" type="submit" style="width:100%">Create admin account</button>
  </form>
</main>
<script src="/static/theme-switch.js"></script>
</body>
</html>
